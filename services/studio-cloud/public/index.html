<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSH Studio 云端管理</title><link rel="stylesheet" href="/style.css"></head>
<body><section id="login" class="login"><form id="login-form" class="card"><span class="eyebrow">DSH STUDIO CLOUD</span><h1>云端管理</h1><p>使用管理员账号登录独立云端服务</p><label>账号或邮箱<input name="login" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button><a href="/account">邀请开通与密码找回</a></form></section>
<div id="shell" hidden><aside><div class="brand">DSH Studio<span>云端管理</span></div><nav id="nav"><button data-page="overview">服务概览</button><button data-page="users">个人账号</button><button data-page="invites">邀请管理</button><button data-page="data">同步数据</button><button data-page="storage">S3 / MinIO</button><button data-page="smtp">邮件服务</button><button data-page="policies">容量与保留策略</button><button data-page="backups">备份与恢复</button><button data-page="updates">系统更新</button><button data-page="audit">操作审计</button></nav><p id="server-version" class="secondary"></p><button id="password-button" class="secondary">修改密码</button><button id="logout" class="secondary">退出登录</button></aside><main><header><div><span class="eyebrow">PERSONAL CLOUD</span><h1 id="title">服务概览</h1></div><button id="refresh" class="secondary">刷新</button></header><div id="content"></div></main></div>
<div id="message" role="status" hidden></div><dialog id="dialog"><form id="dialog-form"><h2 id="dialog-title"></h2><div id="dialog-fields"></div><div class="actions"><button type="button" id="dialog-cancel" class="secondary">取消</button><button>确认</button></div></form></dialog><script src="/admin.js" defer></script></body></html>
